postgres_version: 14

postgres_data_dir: >-
  {{ '/var/lib/postgresql/' ~ postgres_version ~ '/main'
     if ansible_os_family == 'Debian'
     else '/var/lib/pgsql/' ~ postgres_version ~ '/data' }}
allow_remote_connections: true

pg_hba_custom_rules:
  - database: all
    user: dbadmin
    address: 10.0.0.0/24
    method: md5
postgres_port: 5432
listen_addresses: "*"

shared_buffers: 256MB
work_mem: 4MB
maintenance_work_mem: 64MB
effective_cache_size: 1GB

timezone: "UTC"

postgres_extra_config: []
