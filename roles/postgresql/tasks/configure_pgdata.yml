- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  become: yes

- name: Ensure parent directory permissions (RHEL fix)
  ansible.builtin.file:
    path: "{{ postgres_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'
  when: ansible_os_family == "RedHat"
  become: yes

- name: Check if PG_VERSION file exists
  ansible.builtin.stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pg_version_file

- name: Debug - PostgreSQL already initialized
  ansible.builtin.debug:
    msg: "PostgreSQL data directory already initialized"
  when: pg_version_file.stat.exists
