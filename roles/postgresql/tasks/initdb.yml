- name: Check if PostgreSQL is initialized
  stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pg_initialized

# ✅ If directory exists but DB not initialized → CLEAN it
- name: Clean existing PostgreSQL data directory (if corrupted)
  file:
    path: "{{ postgres_data_dir }}"
    state: absent
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists

# ✅ Recreate directory
- name: Recreate PostgreSQL data directory
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists

# ✅ Initialize
- name: Initialize PostgreSQL database (RHEL/Amazon)
  command: postgresql-setup --initdb
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists
  become: yes
