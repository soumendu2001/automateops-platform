- name: Check if PostgreSQL data directory exists
  stat:
    path: "{{ postgres_data_dir }}"
  register: pg_data

- name: Initialize PostgreSQL database (Debian/Ubuntu)
  command: >
    pg_createcluster {{ postgres_version }} main --start
  when:
    - ansible_os_family == "Debian"
    - not pg_data.stat.exists
  become: yes

- name: Initialize PostgreSQL database (RHEL/CentOS)
  command: >
    /usr/pgsql-{{ postgres_version }}/bin/postgresql-{{ postgres_version }}-setup initdb
  when:
    - ansible_os_family == "RedHat"
    - not pg_data.stat.exists
  become: yes

- name: Ensure PostgreSQL data directory permissions
  file:
    path: "{{ postgres_data_dir }}"
    owner: postgres
    group: postgres
    mode: '0700'
  when: pg_data.stat.exists
