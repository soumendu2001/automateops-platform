- name: Force clean PostgreSQL directory before init
  shell: |
    systemctl stop postgresql || true
    rm -rf {{ postgres_data_dir }}/*
  become: yes

- name: Check if PostgreSQL data directory exists
  stat:
    path: "{{ postgres_data_dir }}"
  register: pg_dir

- name: Check if PG_VERSION exists
  stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pg_initialized

# 🔥 Clean ONLY if directory exists AND not initialized
- name: Clean existing PostgreSQL data directory (if corrupted)
  file:
    path: "{{ postgres_data_dir }}"
    state: absent
  when:
    - ansible_os_family == "RedHat"
    - pg_dir.stat.exists
    - not pg_initialized.stat.exists

# ✅ Recreate directory
- name: Recreate PostgreSQL data directory
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists

# ✅ Initialize ONLY if not initialized
- name: Initialize PostgreSQL database (RHEL/Amazon)
  command: >
     sudo -u postgres /usr/bin/initdb -D {{ postgres_data_dir }}
  args:
    creates: "{{ postgres_data_dir }}/PG_VERSION"
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists
  become: yes

# ✅ Fix ownership (important for some AMI images)
- name: Fix PostgreSQL directory ownership
  file:
    path: "{{ postgres_data_dir }}"
    owner: postgres
    group: postgres
    recurse: yes
  when:
    - ansible_os_family == "RedHat"
    - not pg_initialized.stat.exists
  become: yes

# ✅ Debug (optional but useful in CI)
- name: Debug PostgreSQL init status
  debug:
    msg: "PG initialized = {{ pg_initialized.stat.exists }}"
